  - slug: geography-groups
    title: Geographic groupings
    type: derived+curated
    owner: HL7 AU Test Data project
    reserved: false
    purpose: >
      Proposes groupings of entities that are plausibly co-located, as a
      starting point for constructing new consumer journeys.
    governance: >
      Grouping identifies plausible co-location only. Members are free to
      build on and are not reserved to their originating group.
    provenance: >
      Proposed by a script from address data and confirmed by a human. Best-
      effort by design: postcode proximity is a weak proxy, and there are no
      coordinates anywhere in the data set to check real distance against.
    relationships_note: >
      {scenario-groups} draw heavily on the same entities, since each scenario
      was built around a specific locality.
    identification: >
      Derived, then confirmed by a human. Metro entities group by capital
      city; regional entities group by three-digit postcode bucket, widened to
      buckets whose third digit differs by one. Each grouping is then expanded
      by reverse reference to pull in the HealthcareServices and
      PractitionerRoles attached to its organisations, locations and
      practitioners. Every proposal is put to a human with its full suburb
      list, which stands in for the distance check the data cannot support.
    derivation_inputs:
      # Australian postcodes are NOT spatially ordered. Within a capital they
      # were allocated by delivery-office history, so numerically distant codes
      # can be adjacent suburbs (Southbank 3006 / St Kilda 3182, ~6km) and
      # numerically close ones can be far apart. No arithmetic on the digits
      # captures proximity, so the rule differs by density:
      #
      #   metro    -> one group per capital city (everything within a capital
      #               is plausibly co-located, ~50km worst case)
      #   regional -> 3-digit postcode bucket, windowed to include buckets
      #               whose 3rd digit is +/-1, within the same 2-digit prefix
      #
      # These ranges are a curated judgement and must stay TIGHT. A first pass
      # used 0800-0899 for Darwin, which wrongly swept in 0872 — one of the
      # largest postcodes on earth, covering remote Central Australia (Alice
      # Springs, Areyonga, Docker River, Papunya; ~700km across, ~1500km from
      # Darwin). Broad ranges silently turn remote regions into "metro".
      metro_postcode_ranges:
        attester: Stephanie Ong
        confirmed_on: 2026-08-31
        cities:
          - city: Sydney
            ranges: [[1000, 2234]]
          - city: Canberra
            ranges: [[2600, 2618], [2900, 2920]]
          - city: Melbourne
            ranges: [[3000, 3207], [8000, 8999]]
          - city: Brisbane
            ranges: [[4000, 4207], [9000, 9999]]
          - city: Adelaide
            ranges: [[5000, 5199]]
          - city: Perth
            ranges: [[6000, 6199]]
          - city: Hobart
            ranges: [[7000, 7053]]
          - city: Darwin
            ranges: [[800, 832]]
      known_limitations:
        # Recorded so a reviewer knows what the rule cannot catch, and why the
        # suburb list on every candidate is load-bearing rather than decorative.
        - >
          Regional windows can still span great distances where postcodes cover
          vast areas. Buckets 481 (Townsville 4810, Annandale 4814) and 482
          (Mount Isa 4825, Camooweal 4828) are +/-1 adjacent so they merge, but
          Townsville to Mount Isa is ~900km. No postcode rule fixes this; the
          suburb list makes it visible to whoever confirms.
        - >
          There are no coordinates anywhere in the data set (no
          Location.position, no geolocation extensions), so an automated
          distance check is not possible without bundling an external dataset.
          Deliberately deferred: the human confirmation step is the safety net.
    members: []   # populated by write-back once confirmed (task 4.5, 4.7)

  - slug: families
    title: Families
    type: derived+curated
    owner: HL7 AU Test Data project
    reserved: false
    purpose: >
      Identifies entities that constitute a family, for constructing consumer
      journeys involving related patients.
    governance: >
      Grouping identifies plausible family relationships. Members are free to
      build on and are not reserved to their originating group.
    provenance: >
      Proposed by a script from two independent signals and confirmed by a
      human. Where a candidate can be neither confirmed nor rejected because
      the evidence that would settle it is unavailable, it is recorded as
      potentially related rather than forced into a binary.
    relationships_note: >
      Most members currently have no clinical data, so they are also {blank-
      slate-patients}.
    identification: >
      Derived from two primary signals, then confirmed by a human. A shared
      Medicare card is the strongest: the card number is shared by a family
      and only the final individual reference number differs. The
      RelatedPerson network is the second, giving an explicit relationship
      code. Neither subsumes the other — a newborn not yet on the card is
      found only by the RelatedPerson network — so both are applied and
      combined. Matching surname or address is used only to propose further
      candidates for review.
    members: []   # populated by write-back once confirmed (task 4.6, 4.7)

