  - slug: blank-slate-patients
    title: Blank-slate patients
    type: derived
    owner: HL7 AU Test Data project
    reserved: false
    purpose: >
      Identifies patients with no clinical data, so they can be selected for a
      new consumer journey without pre-existing content conflicting.
    governance: >
      The purpose of this subset is to identify patients that are free to
      build on. Adding clinical data to a member simply removes it from the
      subset on the next regeneration.
    provenance: >
      Computed from the data set on every regeneration rather than recorded.
      Membership therefore changes automatically as clinical data is added.
    relationships_note: >
      Many members also appear in {families}, and some are {missing-
      suppressed-data} instances.
    identification: >
      Derived automatically. A patient is a member when no clinical resource
      in the data set references it as subject. Administrative links such as
      RelatedPerson or Coverage do not count, because they record no clinical
      fact for new content to conflict with.
    derived_by: scripts/data-subsets/blank_slate_patients.py (task 3.1)
