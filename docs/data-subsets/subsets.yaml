  - slug: community-contributions
    title: Community contributions
    type: derived+curated
    owner: HL7 AU Test Data project
    reserved: false
    purpose: >
      Identifies which community organisation contributed which entities.
    governance: >
      Attribution records origin only. It places no constraint on adding to or
      modifying the contributed entities or their linked resources.
    provenance: >
      Attributed from the commit that introduced each file, cross-checked
      against a human-attested list. Attribution is best-effort: a contributor
      using a personal email address, or a merge that did not preserve
      original authorship, is not detected, so the list is not exhaustive.
    relationships_note: >
      No notable relationships to other subsets.
    identification: >
      Derived from commit authorship, then cross-checked. The commit that
      introduced each file is matched against recognised organisation email
      domains, and the result is compared with an independently human-attested
      list so that a disagreement is reported rather than an entity silently
      dropping out.
      (see spec scenario "The limits of git-based attribution are stated").
    derivation_inputs:
      domains:
        - domain: digitalhealth.gov.au
          organisation: ADHA (Australian Digital Health Agency)
    human_attested:
      # Entities a human has independently stated belong to an organisation's
      # contributions. NOT overrides: the commit-authorship scan currently
      # finds all of these unaided, so the list functions as a CROSS-CHECK on
      # the derivation rather than a correction to it.
      #
      # Its value is early warning. If one of these files is later re-added by
      # a maintainer in a way that loses the original authorship, the scan
      # stops finding it and contributions.py reports the disagreement instead
      # of the entity silently dropping out of the subset.
      #
      # An entity the scan genuinely cannot attribute can also be listed here;
      # contributions.py reports those separately as attested-only.
      - organisation: ADHA (Australian Digital Health Agency)
        attester: Stephanie Ong
        confirmed_on: 2026-08-31
        note: >
          All 12 are Organization resources representing HSP-O (Health
          Service Provider - Organisation) and HAE (Healthcare Australia
          Entity) example entities. Introduced together in commit 5727b6b
          ("Examples of HSP-O and HAE organisations") by
          richard.townleyoneill@digitalhealth.gov.au.
        members:
          - Organization-benalla-health-network
          - Organization-cremorne-care-and-support
          - Organization-curtain-care-and-support
          - Organization-goondiwindi-health-network
          - Organization-hayborough-care-and-support
          - Organization-leeton-health-network
          - Organization-menzies-health-network
          - Organization-oxenford-care-and-support
          - Organization-reid-health-network
          - Organization-sorell-health-network
          - Organization-south-lake-care-and-support
          - Organization-tarneit-health-network
    members: []   # populated by write-back once the initial confirmation run completes (task 7.1)

  - slug: missing-suppressed-data
    title: Missing and suppressed data examples
    type: derived+curated
    owner: HL7 AU Test Data project
    reserved: true
    purpose: >
      Identifies the instances demonstrating the correct representation of
      missing or suppressed data.
    governance: >
      Instances are deliberately shaped to demonstrate a specific
      representation of absent data. Adding to or modifying their linked
      resources risks misrepresenting what they demonstrate.
    provenance: >
      Drawn from the repository's own missing and suppressed data
      documentation, extended by a keyword scan whose hits are individually
      confirmed against the resource's actual content. This is the one subset
      not restricted to administrative entities, because the property it
      demonstrates attaches to an Observation exactly as it does to a Patient.
    relationships_note: >
      Some members are also {blank-slate-patients}.
    identification: >
      Derived from the documented cases, then extended by curation. Resource
      ids are scanned for keywords such as missing, suppressed and masked, and
      each hit is put to a human, who checks the resource actually carries a
      data-absent-reason mechanism rather than matching the keyword by
      coincidence.
    derivation_inputs:
      documented_sources:
        - docs/MissingAndSuppressedData_TestData.md
        - https://confluence.hl7.org/spaces/HAFWG/pages/413041838/Missing+Suppressed+Data+examples
      keyword_scan:
        - missing
        - suppressed
        - masked
        - not-performed
        - cancelled
        - unknown
        - dataabsentreason
        - notasked
        - empty
    members: []   # populated by write-back once the initial confirmation run completes (task 7.1)

