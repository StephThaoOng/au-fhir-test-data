# Facts file for the data-subset-identification capability
# (openspec/specs/data-subset-identification/spec.md, once archived).
#
# This file is the authoritative home for Declared and Curated facts, and for
# confirmed Derived+Curated decisions. It is NOT the home for Derived facts —
# those are recomputed fresh on every regeneration by scripts/data-subsets/*.py
# and never persisted here.
#
# Schema per subset entry (openspec/changes/add-data-subset-identification/tasks.md 1.1):
#   slug          stable kebab-case identifier, never renamed once published
#   title         display name
#   type          derived | declared | curated | derived+curated
#   owner         organisation or role accountable for the subset
#   reserved      bool — does new or altered content in this entity's network of linked
#                 resources risk conflicting with the subset's purpose?
#                 Read-only use is ALWAYS unconstrained; `reserved` governs write intent
#                 only (design.md D10).
#   governance    one-line rationale for the `reserved` value
#   provenance    who authored/submitted the entities (data provenance, not generation provenance)
#   intended_use  what the subset is for
#   relationships list of other subset slugs this subset relates to
#   members       hand-seeded facts (declared/curated) or confirmed candidates
#                 (derived+curated); empty for pure derived subsets, which are
#                 recomputed on every run and never stored here
#
# SCOPE CONSTRAINT — administrative entities only
#
# Identifying data subsets is constrained to administrative resource types:
#   Patient, RelatedPerson, Practitioner, PractitionerRole, Organization,
#   HealthcareService, Location, Endpoint
#
# These are the scarce ones: their key identifiers and some core attributes are
# allocated by Services Australia, and correspond to entities provisioned in the
# HI Vendor Test Environment. The instances here map those records into FHIR and
# may include some data enrichment, but generally need to stay aligned with the
# corresponding entities in that environment — so an administrative entity
# cannot simply be created or modified on demand within this project. They are
# therefore the entities that may carry governance considerations, which is what
# this wiki exists to identify and document.
#
# Clinical resources carry far less shared governance with external parties and
# can be authored more freely, so tracking their subset membership is low value.
# Where it is needed, clinical content is retrievable from the administrative
# entity by FHIR mechanisms.
#
# ONE EXEMPTION: missing-suppressed-data (see its governance field).
#
# Declared entries additionally carry: source, source_revision
#   source_revision is an OUTPUT, not a hand-set input (design.md D11): Declared sources are
#   read at their current state on each generation, and the generation writes back the
#   revision it read so a later drift report can name what changed.
# Curated entries additionally carry: attester, confirmed_on (per member, or per subset)

schema_version: 1

subsets:

  # --- Declared -------------------------------------------------------------

  - slug: inferno-default-patients
    title: Inferno AU Core test suite default patients
    type: declared
    owner: inferno_suite_generator maintainers
    reserved: true
    purpose: >
      Identifies the patients the AU Core Inferno test kit uses as its default
      patient set.
    governance: >
      The set is relied on to exercise every Must Support element in
      combination. Adding to or modifying these patients or their linked
      resources must preserve that coverage, and should be coordinated with
      the test kit maintainers.
    provenance: >
      Stated by the Inferno test kit itself rather than decided here. The set
      is intended to give full Must Support coverage, but that is an intent
      rather than a guarantee — nothing verifies that it achieves full
      coverage or that it is the smallest set that does.
    relationships_note: >
      Six of the seven members are also {au-ps-test-patients}, so a change
      affecting one set very likely affects the other. A few are also {au-
      core-ig-examples}.
    identification: >
      Declared, then drift-checked. The patient id list is read from the
      inferno_suite_generator repository at its current revision on every
      regeneration and compared against the list recorded here; any difference
      is reported rather than silently overwritten.
    source: inferno_suite_generator, lib/inferno_suite_generator/utils/helpers.rb,
      method default_patient_ids_string (lines 217-219 at time of transcription)
    source_revision: latest — tracks the current revision; written back by each
      generation run with the revision actually read (design.md D11)
    members:
      - baratz-toni
      - irvine-ronny-lawrence
      - italia-sofia
      - howe-deangelo
      - hayes-arianne
      - baby-banks-john
      - banks-mia-leanne

