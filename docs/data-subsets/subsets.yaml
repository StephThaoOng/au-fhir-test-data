  - slug: au-core-ig-examples
    title: AU Core IG example entities
    type: derived
    owner: AU Core IG authors
    reserved: true
    purpose: >
      Identifies the administrative entities and resources used in the AU Core
      IG examples.
    governance: >
      Published IG examples must not be modified, added to, or removed without
      coordination with and approval from the IG authors.
    provenance: >
      Generally derived from Services Australia data mapped to FHIR, with some
      data enrichment and subsequent curation for the AU Core IG examples.
      Some mapped data has been stripped to focus the examples on
      demonstrating support for Must Support elements. The examples are
      illustrative, not normative or fully representative of real-world data.
    relationships_note: >
      Some members are also included in the {inferno-default-patients} subset.
    identification: >
      Derived automatically. Each entity in this data set is matched against
      the example set published in the AU Core IG repository under
      input/examples/. Matching is on resource identity — resource id, or
      business identifier where the ids differ — never on content, because IG
      examples are published with some Services Australia identifier data
      stripped.
    source: hl7au/au-fhir-core, input/examples/
    derived_by: scripts/data-subsets/ig_examples.py (task 3.3)

