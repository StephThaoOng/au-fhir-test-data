  - slug: connected-care-journeys
    title: Connected Care consumer journeys
    type: declared
    owner: DoHAC
    reserved: true
    purpose: >
      Identifies the entities belonging to the Connected Care consumer
      journeys — Alex's Story and Yuri's Story.
    governance: >
      Each journey tells one patient's story end-to-end. Adding to or
      modifying a member entity or its linked resources risks conflicting with that
      story's clinical timeline, so coordination with DoHAC is required.
    provenance: >
      Alex's Story membership is declared by a data set document held
      alongside the instances. Yuri's Story has no source document yet, so its
      membership is the provisional remainder of the directory not claimed by
      Alex's Story.
    relationships_note: >
      Members are geographically clustered — Kalgoorlie WA and Bathurst NSW —
      but do not appear in {geography-groups}, which currently indexes only
      the default branch.
    identification: >
      Declared, and read from a branch. These entities are not on the default
      branch, so the derivation reads the connected-care branch directly and
      partitions it using the Alex's Story document.
    source: >
      Alex's Story — au-fhir-test-data-set/connected-care/Alex Story Data Set.md,
      on the connected-care branch (not on master).
      Yuri's Story — no source document yet; membership is the provisional
      remainder of the connected-care directory not claimed by Alex's Story.
    source_revision: connected-care branch (upstream/connected-care, origin/review/connected-care)
    members:
      alex-story:
        status: declared
        note: Membership extracted from the source document by scripts/data-subsets/connected_care.py (task 4.4); not hand-seeded.
      yuri-story:
        status: provisional
        note: >
          Remainder of au-fhir-test-data-set/connected-care/ not claimed by
          Alex's Story. Published as provisional per spec scenario "The
          provisional Yuri's Story attribution is marked as such" until a
          source document exists.

