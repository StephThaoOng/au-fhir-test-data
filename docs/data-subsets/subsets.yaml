  - slug: sparked-cdg-journeys
    title: Sparked Clinical Design Group consumer journeys
    type: curated
    owner: Sparked
    reserved: false
    purpose: >
      Identifies the entities used in Sparked Clinical Design Group consumer
      journeys, grouped by named journey.
    governance: >
      Journey membership does not reserve an entity. An entity used in a
      journey may also appear in the corresponding IG project use case and be
      progressed into a technical use case, so these entities are free to
      build on.
    provenance: >
      Declared by the Sparked Clinical Design Group. Members are recorded as
      resolved resource ids rather than display names so membership is
      unambiguous.
    relationships_note: >
      Several members also appear in {scenario-groups}, and some are {au-ps-
      ig-examples}.
    identification: >
      Curated. Journey membership is stated by Sparked and recorded in the
      facts file; the AU Encounter Records journey additionally records each
      participant's stated journey role alongside the specialty declared by
      their PractitionerRole, because the two often differ.
    attester: Shelley Behen
    confirmed_on: 2026-08-31
    members:
      au-ps:
        interstate-gp-visit:
          - id: banks-jeramy-ezra
            downstream_use: []   # Curated, manual entry — see task 1.3 / spec scenario "Downstream use of a journey entity is visible"
        referral-to-specialist-and-allied-health:
          - id: johnson-joyce
            downstream_use: []
          - id: burrows-ginger
            downstream_use: []
        emergency-hospital-attendance:
          - id: morris-charlotte
            downstream_use: []
        hospital-to-aged-care-interstate-transfer:
          - id: nielsen-eleanore
            downstream_use: []
        pre-operative-surgical:
          - id: simpson-tristan
            downstream_use: []
      au-encounter-records:
        # Journey value may be a plain list of members (as under au-ps above)
        # or this richer mapping with `members` plus journey-level metadata.
        chemotherapy-acute-admission-to-hith:
          title: Chemotherapy — acute admission to HITH and outpatient care
          attester: Stephanie Ong
          confirmed_on: 2026-08-31
          source: >
            AU Encounter Records consumer journey care team diagram
            (case scenario + care team panel).
          case_scenario: >
            Kendall presented for chemotherapy but was acutely unwell,
            requiring inpatient admission and multidisciplinary treatment
            before transitioning to Hospital in the Home and ongoing
            outpatient care.
          narrative_status: >
            CARE TEAM ONLY. The 11 named individuals resolve to existing test
            data, but the clinical narrative this journey describes —
            chemotherapy, the acute inpatient admission, the HITH transition
            and outpatient follow-up — does not exist as test data yet. No
            chemotherapy or admission Encounter references Kendall.
          conflicts:
            # Building this journey means ADDING to an entity already
            # committed elsewhere — precisely the write-intent hazard this
            # wiki exists to surface (see the Reservation status requirement).
            - entity: Patient/sandilands-kendall
